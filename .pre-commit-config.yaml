# Managed with prek (https://github.com/j178/prek), a drop-in pre-commit runner.
# Enable once per clone:  prek install
# Run on demand:          prek run --all-files
repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright (ndsel python types)
        # Type-check the Python package in its own uv environment so the hook
        # is reproducible regardless of what is on the caller's PATH/venv.
        # --project points pyright at python/ndsel/pyproject.toml ([tool.pyright]).
        entry: uv run --project python/ndsel pyright --project python/ndsel
        language: system
        pass_filenames: false
        files: ^python/ndsel/.*\.py$

      - id: tsc
        name: tsc (ndsel typescript types)
        # tsc --noEmit via the package's own script; --prefix runs it in
        # typescript/ so it picks up tsconfig.json and node_modules.
        entry: npm --prefix typescript run --silent typecheck
        language: system
        pass_filenames: false
        files: ^typescript/(src|test)/.*\.ts$|^typescript/(tsconfig|package(-lock)?)\.json$

      - id: cargo-check
        name: cargo check (ndsel rust types)
        # --manifest-path keeps this cwd-independent; --all-targets covers tests.
        entry: cargo check --manifest-path rust/ndsel/Cargo.toml --all-targets
        language: system
        pass_filenames: false
        files: ^rust/ndsel/(src/.*\.rs|Cargo\.(toml|lock))$

[project]
name = "ndsel"
version = "0.1.0"
description = "JSON-serializable n-dimensional spatial queries (Python implementation)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndsel"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.21", "pyright>=1.1.390"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src/ndsel", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
